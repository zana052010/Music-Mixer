name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"
  PYTHONUTF8: "1"
  APP_VERSION: 1.0.${{ github.run_number }}
  CI_STATUS_ISSUE_TITLE: "CI status"

jobs:
  installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download FFmpeg, yt-dlp, BASS and Deno
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            mkdir -p downloads tools/ffmpeg/bin tools/yt-dlp tools/bass/x64 tools/deno
            curl -fsSL --retry 3 -o downloads/ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            7z x -y -odownloads/ffmpeg downloads/ffmpeg.zip > /dev/null
            cp downloads/ffmpeg/*/bin/ffmpeg.exe downloads/ffmpeg/*/bin/ffprobe.exe tools/ffmpeg/bin/
            curl -fsSL --retry 3 -o tools/yt-dlp/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
            curl -fsSL --retry 3 -o downloads/bass.zip https://www.un4seen.com/files/bass24.zip
            7z x -y -odownloads/bass downloads/bass.zip > /dev/null
            cp downloads/bass/x64/bass.dll tools/bass/x64/bass.dll
            curl -fsSL --retry 3 -o downloads/deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip
            7z x -y -otools/deno downloads/deno.zip > /dev/null
            tools/ffmpeg/bin/ffmpeg.exe -hide_banner -version
            filters="$(tools/ffmpeg/bin/ffmpeg.exe -hide_banner -filters)"
            if grep -q rubberband <<< "$filters"; then echo "rubberband: ok"; else echo "rubberband: MISSING"; exit 1; fi
            echo "yt-dlp: $(tools/yt-dlp/yt-dlp.exe --version)"
            tools/deno/deno.exe --version
            ls -la tools/bass/x64
          } 2>&1 | tee logs/tools.log

      - name: Build portable Demucs
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install "numpy==1.26.4" demucs==4.0.1 soundfile "pyinstaller==6.16.0" "pyinstaller-hooks-contrib>=2025.8"
            python -c "import numpy, torch, torchaudio; print('numpy', numpy.__version__, 'torch', torch.__version__, 'torchaudio', torchaudio.__version__)"
            python -m PyInstaller --noconfirm --clean --onedir --console --name demucs \
              --distpath build/demucs-dist --workpath build/demucs-work \
              --collect-all demucs --collect-all julius --collect-all openunmix \
              --collect-submodules torchaudio --hidden-import soundfile \
              installer/demucs_entry.py
            mkdir -p tools/demucs
            cp -r build/demucs-dist/demucs/. tools/demucs/
            export TORCH_HOME="$(cygpath -w "$PWD/tools/demucs/models")"
            python -c "from demucs.pretrained import get_model; get_model('htdemucs'); print('htdemucs model: ok')"
            du -sh tools/demucs
          } 2>&1 | tee logs/demucs.log

      - name: Smoke-test portable Demucs
        run: |
          set -euo pipefail
          {
            export PATH="$PWD/tools/ffmpeg/bin:$PATH"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:duration=6" -ac 2 -ar 44100 build/smoke.wav
            tools/demucs/demucs.exe --two-stems vocals -n htdemucs -d cpu --out build/smoke-out build/smoke.wav
            ls -la build/smoke-out/htdemucs/smoke
            test -f build/smoke-out/htdemucs/smoke/vocals.wav
            test -f build/smoke-out/htdemucs/smoke/no_vocals.wav
            echo "demucs smoke test: ok"
          } 2>&1 | tee logs/smoke.log

      - name: Publish app (self-contained win-x64)
        run: |
          set -euo pipefail
          {
            dotnet publish src/MusicMixer.Desktop/MusicMixer.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
            mkdir -p publish/tools
            cp -r tools/. publish/tools/
            cp tools/bass/x64/bass.dll publish/bass.dll
            rm -rf publish/tools/bass
            test -f publish/MusicMixer.exe
            du -sh publish
          } 2>&1 | tee logs/publish.log

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DPublishDir=$PWD\publish" installer\MusicMixer.iss 2>&1 | Tee-Object -FilePath logs\inno.log
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem installer\Output | Format-Table Name, Length | Out-String | Tee-Object -FilePath logs\inno.log -Append

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${APP_VERSION}" "installer/Output/MusicMixer-Setup-${APP_VERSION}.exe" \
            --target "$GITHUB_SHA" --title "Music Mixer ${APP_VERSION}" --notes-file installer/RELEASE_NOTES.md 2>&1 | tee logs/release.log

      # Агент, который ведёт репозиторий, не читает логи Actions напрямую,
      # поэтому итог сборки установщика пишется в issue "CI status".
      - name: Report to CI status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p logs
          short_sha="${GITHUB_SHA::7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### installer ${JOB_STATUS} | windows-latest | ${short_sha} | v${APP_VERSION}"
            echo
            echo "Run: ${run_url}"
            echo
            echo '```text'
            ls -la installer/Output 2>/dev/null
            grep -h -E "rubberband:|yt-dlp:|deno [0-9]|htdemucs model|smoke test|MusicMixer.exe|https://github.com/.*/releases/" logs/*.log 2>/dev/null
            echo '```'
            if [ "${JOB_STATUS}" != "success" ]; then
              for f in logs/tools.log logs/demucs.log logs/smoke.log logs/publish.log logs/inno.log logs/release.log; do
                if [ -f "$f" ]; then
                  echo
                  echo "#### $f (tail)"
                  echo '```text'
                  tail -n 60 "$f"
                  echo '```'
                fi
              done
            fi
          } > installer-report.md
          head -c 60000 installer-report.md > installer-report-trimmed.md
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $CI_STATUS_ISSUE_TITLE" --json number,title --jq ".[] | select(.title == \"$CI_STATUS_ISSUE_TITLE\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file installer-report-trimmed.md
          fi
